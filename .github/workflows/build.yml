name: Build CarPlay HUD shim

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build release .so
        working-directory: mazda
        run: make release

      - name: Upload built .so
        uses: actions/upload-artifact@v4
        with:
          name: libpatch-blmjcicarplay
          path: mazda/build/release/libpatch-blmjcicarplay.so
